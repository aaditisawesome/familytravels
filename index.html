<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Travel Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Our Family Adventures</h1>
            <p class="subtitle">Click on any marker to explore our travels</p>
        </header>
        
        <!-- Map Container -->
        <div id="map"></div>
    </div>
    
    <!-- Modal Overlay -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <p id="modal-year" class="modal-year"></p>
            </div>
            
            <div id="modal-description" class="modal-description"></div>
            
            <!-- Photo Gallery -->
            <div class="photo-gallery">
                <button id="prev-btn" class="gallery-btn" aria-label="Previous photo">‹</button>
                
                <div class="photo-container">
                    <img id="modal-image" src="" alt="Trip photo">
                    <div id="photo-counter" class="photo-counter"></div>
                </div>
                
                <button id="next-btn" class="gallery-btn" aria-label="Next photo">›</button>
            </div>
        </div>
    </div>
    
    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    
    <!-- Trip Data -->
    <script src="data/trips.js"></script>
    
    <!-- Main Script -->
    <script src="script.js"></script>
</body>
</html>
